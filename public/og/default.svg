<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#14222f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#36e0ff" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Aperture mark, same geometry as the favicon so the tab icon and the share
       card are recognisably the same thing. -->
  <g transform="translate(88, 88)">
    <circle cx="34" cy="34" r="30" fill="none" stroke="#0a6c80" stroke-width="7"/>
    <circle cx="34" cy="34" r="11" fill="#36e0ff"/>
  </g>

  <text x="176" y="132" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="21" letter-spacing="4.6"
        fill="#36e0ff" opacity="0.92">DAVIDCBERRY.COM</text>

  <text x="88" y="316" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700"
        letter-spacing="-2.4" fill="#faf9f5">David Berry</text>

  <rect x="88" y="360" width="104" height="5" fill="#36e0ff"/>

  <text x="88" y="432" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="35" font-weight="500"
        fill="#6f8398">Engineering educator. Infrastructure operator.</text>
  <text x="88" y="482" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="35" font-weight="500"
        fill="#6f8398">AI governance in practice.</text>

  <text x="88" y="566" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="19" letter-spacing="2.2"
        fill="#0a6c80">SECURITY  ·  AI GOVERNANCE  ·  CAREER</text>

  <rect x="0" y="622" width="1200" height="8" fill="#36e0ff"/>
</svg>